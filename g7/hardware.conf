# LG G7 ThinQ - judyln_lao_kr rev_1.0
# Hardware reference. Not yet a bootable configuration.

SOC=sdm845
SOC_REV=2.1

GICD=0x17A00000
GICR=0x17A60000
UFS_BASE=0x01D84000
UFS_SIZE=0x2500
TIMEBASE=19200000

RAM_PHYS_START=0x80000000
RAM_PHYS_SIZE=0xFDFA0000

SPLASH_RESERVED_BASE=0x9D400000
SPLASH_RESERVED_SIZE=0x02400000

# Must be validated before framebuffer writes:
FB_BASE=UNVERIFIED
FB_WIDTH=UNVERIFIED
FB_HEIGHT=UNVERIFIED
FB_STRIDE=UNVERIFIED
FB_PIXEL_FORMAT=UNVERIFIED

# Must be selected from a safe physical RAM range:
XNU_DRAM_BASE=UNVERIFIED
XNU_DRAM_SIZE=UNVERIFIED

ANDROID_BOOT_HEADER_VERSION=1

# LG G7 display observations from Android DRM
# Do not treat Android DRM buffers as ABL framebuffer addresses.

PANEL_WIDTH=1440
PANEL_HEIGHT=3120
PANEL_REFRESH_HZ=60

ANDROID_DRM_ALLOC_WIDTH=1472
ANDROID_DRM_PITCH=5888
ANDROID_DRM_FORMAT=AB24

SPLASH_RESERVED_BASE=0x9D400000
SPLASH_RESERVED_SIZE=0x02400000

ABL_FB_BASE=0x9D400000
ABL_FB_STRIDE=UNVERIFIED
ABL_FB_FORMAT=UNVERIFIED
